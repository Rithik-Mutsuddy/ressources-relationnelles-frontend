<div class="admin-layout">

  <!-- ── Sidebar ─────────────────────────────── -->
  <aside class="sidebar">

    <!-- Identité -->
    <div class="sidebar__user">
      <div class="sidebar__avatar">{{ getInitial() }}</div>
      <div class="sidebar__user-info">
        <p class="sidebar__user-name">{{ user()?.firstname }} {{ user()?.lastname }}</p>
        <p class="sidebar__user-role">{{ getRoleLabel() }}</p>
      </div>
    </div>

    <!-- Section Administration (ROLE_ADMIN+) -->
    @if (isAdmin()) {
      <div class="sidebar__section">
        <p class="sidebar__section-label">Administration</p>

        <a routerLink="/admin/resources"
           routerLinkActive="sidebar__link--active"
           class="sidebar__link">
          <svg viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"/>
          </svg>
          Gestion des ressources
        </a>

        <a routerLink="/admin/categories"
           routerLinkActive="sidebar__link--active"
           class="sidebar__link">
          <svg viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
            <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/>
          </svg>
          Catégories
        </a>

        <a routerLink="/admin/users"
           routerLinkActive="sidebar__link--active"
           class="sidebar__link">
          <svg viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/>
          </svg>
          Utilisateurs
        </a>

        <a routerLink="/admin/statistics"
           routerLinkActive="sidebar__link--active"
           class="sidebar__link">
          <svg viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
            <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
          </svg>
          Statistiques
        </a>
      </div>
    }

    <!-- Section Super Admin -->
    @if (isSuperAdmin()) {
      <div class="sidebar__section">
        <p class="sidebar__section-label">Super Admin</p>

        <a routerLink="/superadmin/accounts"
           routerLinkActive="sidebar__link--active"
           class="sidebar__link">
          <svg viewBox="0 0 20 20" fill="currentColor" width="17" height="17">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z" clip-rule="evenodd"/>
          </svg>
          Gestion des comptes
        </a>
      </div>
    }

    <!-- Retour au site -->
    <div class="sidebar__footer">
      <a routerLink="/citizen/dashboard" class="sidebar__link sidebar__link--muted">
        <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
          <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
        Retour au dashboard
      </a>
    </div>
  </aside>

  <!-- ── Contenu principal ──────────────────── -->
  <main class="admin-main">
    <router-outlet />
  </main>
</div>
